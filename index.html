<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GETDDO — LG유플러스 응모 이벤트 플랫폼</title>
        <meta
            name="description"
            content="응모권을 모아 원하는 이벤트에 응모하는 LG유플러스 응모 이벤트 플랫폼 GETDDO."
        />
        <script>
            // React 마운트 전에 저장된 테마를 적용해 라이트 플래시를 막는다.
            // getddo-ui-settings(zustand persist)를 우선 읽고, next-themes 시절의 원시 'theme' 키를 마이그레이션 fallback으로 확인한다
            try {
                var saved = JSON.parse(localStorage.getItem('getddo-ui-settings'));
                var theme =
                    (saved && saved.state && saved.state.theme) ||
                    localStorage.getItem('theme') ||
                    'light';
                if (
                    theme === 'dark' ||
                    (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
                ) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/app/main.tsx"></script>
    </body>
</html>
